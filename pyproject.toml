[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobmatch"
version = "0.1.0"
description = "Agentic HR resume-matching AaaS"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.20,<0.1",

    # DB / ORM
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<0.31",
    "psycopg2-binary>=2.9,<3.0",
    "pgvector>=0.3,<0.4",

    # Queue
    "celery>=5.4,<6.0",
    "redis>=5.2,<6.0",

    # Agent orchestration
    "langgraph>=0.3,<0.4",

    # LLM routing
    "litellm>=1.65,<2.0",

    # Embeddings / reranker
    "openai>=1.58,<2.0",
    "sentence-transformers>=3.4,<4.0",

    # Resume parsing
    "pypdf>=5.3,<6.0",
    "python-docx>=1.1,<2.0",

    # Storage (R2 / S3-compatible)
    "boto3>=1.37,<2.0",

    # Email
    "resend>=2.7,<3.0",

    # Auth
    "clerk-backend-api>=1.7,<2.0",
    "python-jose[cryptography]>=3.3,<4.0",

    # Observability
    "sentry-sdk[fastapi]>=2.20,<3.0",
    "logfire>=3.11,<4.0",

    # Crypto / security
    "cryptography>=43.0,<45.0",

    # Utilities
    "httpx>=0.28,<0.29",
    "tenacity>=9.0,<10.0",
    "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<0.26",
    "pytest-cov>=6.0,<7.0",
    "vcrpy>=6.0,<7.0",
    "httpx>=0.28,<0.29",
    "ruff>=0.9,<0.10",
    "mypy>=1.14,<2.0",
    "faker>=33.0,<34.0",
    "factory-boy>=3.3,<4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]

[tool.coverage.report]
# Target is 70% for completed app; Phase 0 stubs make this unreachable until Phase 4+
fail_under = 0
